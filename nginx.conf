server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location /nv-dash/assets/ {
        try_files $uri =404;
    }
    location /nv-dash/ {
        try_files $uri $uri/ /nv-dash/index.html;
    }
    location / {
        return 404;
    }
}
